<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h2>Student Registration Form</h2>

    <form>
        <label>Full Name:</label><br>
        <input type="text" placeholder="Enter your full name" required><br><br>

        <label>Email:</label><br>
        <input type="email" placeholder="Enter your Email" required><br><br>

        <label>Password:</label><br>
        <input type="password" placeholder="Enter password" required><br><br>

        <label>Mobile number:</label><br>
        <input type="tel" placeholder="Enter your Mobile number" required><br><br>

        <label>Date:</label><br>
        <input type="date"><br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender" value="Male">Male
        <input type="radio" name="gender" value="Female">Female
        <input type="radio" name="gender" value="Other">Other
        <br><br>

        <label>Course:</label><br>
        <select>
            <option>Select course</option>
            <option>AIML  Engg.</option>
            <option>CSE    Engg.</option>
            <option>Mechanical   Engg.</option>
            <option>Civil  Engg.</option>
        </select>

        <br><br>
        <label>Skills:</label><br>
        <input type="checkbox" name="skill" value="HTML">HTML
        <input type="checkbox" name="skill" value="Javascript">Javascript
        <input type="checkbox" name="skill" value="CSS">CSS
        <input type="checkbox" name="skill" value="Python">Python

        <br><br>
        <label>Address:</label><br>
        <textarea rows="4" cols="40" placeholder="Enter the address"></textarea>

        <br><br>
        <input type="submit" value="Register">
        <input type="reset" value="Clear">
    </form>
</body>
</html>
